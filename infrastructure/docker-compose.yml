services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smart_agriculture}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks:
      - smart-agriculture-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-agri_admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-agri_dev_only}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-smart_agriculture}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-smart_agriculture}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-smart-agriculture-dev-token}
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      - smart-agriculture-network
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agri}:${POSTGRES_PASSWORD:-agri_dev_only}@postgres:5432/${POSTGRES_DB:-smart_agriculture}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_TOKEN:-smart-agriculture-dev-token}
      INFLUX_ORG: ${INFLUXDB_ORG:-smart_agriculture}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET:-smart_agriculture}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-30}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-60}
      TEMPERATURE_HIGH_THRESHOLD: ${TEMPERATURE_HIGH_THRESHOLD:-35}
      HUMIDITY_LOW_THRESHOLD: ${HUMIDITY_LOW_THRESHOLD:-40}
      SOIL_MOISTURE_LOW_THRESHOLD: ${SOIL_MOISTURE_LOW_THRESHOLD:-30}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - smart-agriculture-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    networks:
      - smart-agriculture-network
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "farm/healthcheck", "-m", "ping", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - smart-agriculture-network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge-gateway:
    build:
      context: ..
      dockerfile: edge-gateway/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SERVER_BATCH_URL: http://server:8000/api/v1/telemetry/batch
      SERVER_HEALTH_URL: http://server:8000/api/v1/health
      EDGE_DB_PATH: /data/edge.db
    volumes:
      - edge_data:/data
    networks:
      - smart-agriculture-network
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, sqlite3; os.kill(1, 0); db=sqlite3.connect('/data/edge.db', timeout=2); assert db.execute('PRAGMA quick_check').fetchone()[0] == 'ok'; db.close()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  sensor-simulator:
    build:
      context: ..
      dockerfile: sensor-simulator/Dockerfile
      network: host
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    restart: unless-stopped
    networks:
      - smart-agriculture-network
    profiles: ["normal", "simulator"]
    depends_on:
      mosquitto:
        condition: service_healthy
      edge-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, socket; os.kill(1, 0); sock=socket.create_connection(('mosquitto', 1883), timeout=2); sock.close()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["python3", "main.py", "--interval", "10"]

  sensor-simulator-demo:
    build:
      context: ..
      dockerfile: sensor-simulator/Dockerfile
      network: host
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    networks:
      - smart-agriculture-network
    depends_on:
      mosquitto:
        condition: service_healthy
      edge-gateway:
        condition: service_healthy
    profiles: ["demo"]
    command: ["python3", "main.py", "--demo", "--interval", "1"]

  sensor-simulator-edge-demo:
    build:
      context: ..
      dockerfile: sensor-simulator/Dockerfile
      network: host
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    networks:
      - smart-agriculture-network
    depends_on:
      mosquitto:
        condition: service_healthy
      edge-gateway:
        condition: service_healthy
    profiles: ["edge-demo"]
    command: ["python3", "edge_demo.py", "--interval", "1"]

volumes:
  mosquitto_data:
  postgres_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
  edge_data:

networks:
  smart-agriculture-network:
    driver: bridge

